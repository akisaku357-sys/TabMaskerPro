<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --primary-color: #4f46e5;
      --primary-hover: #4338ca;
      --bg-color: #f9fafb;
      --card-bg: #ffffff;
      --text-main: #111827;
      --text-muted: #6b7280;
      --border-color: #e5e7eb;
    }

    body {
      width: 320px;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
    }

    .container {
      padding: 20px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .header img {
      width: 32px;
      height: 32px;
    }

    .header h1 {
      font-size: 18px;
      margin: 0;
      color: var(--primary-color);
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text-main);
    }

    .input-wrapper {
      position: relative;
    }

    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 14px;
      transition: border-color 0.2s, box-shadow 0.2s;
      box-sizing: border-box;
      background: var(--card-bg);
    }

    input:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 24px;
    }

    button {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      border: none;
    }

    #save {
      background-color: var(--primary-color);
      color: white;
    }

    #save:hover {
      background-color: var(--primary-hover);
    }

    #reset {
      background-color: #fff;
      color: #ef4444;
      border: 1px solid #ef4444;
    }

    #reset:hover {
      background-color: #fef2f2;
    }

    .footer {
      margin-top: 20px;
      padding-top: 15px;
      border-top: 1px solid var(--border-color);
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
    }

    .status-msg {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #10b981;
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      z-index: 100;
      white-space: nowrap;
    }

    .status-msg.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="icons/icon48.png" alt="Logo">
      <h1>Tab Masker Pro</h1>
    </div>

    <div class="form-group">
      <label for="domain">匹配域名关键词</label>
      <input type="text" id="domain" placeholder="例如: youtube.com">
    </div>

    <div class="form-group">
      <label for="title">伪装标题</label>
      <input type="text" id="title" placeholder="例如: 财务报表 - 2024">
    </div>

    <div class="form-group">
      <label for="icon">伪装图标 URL</label>
      <input type="text" id="icon" placeholder="https://example.com/favicon.ico">
    </div>

    <div class="actions">
      <button id="reset">重置</button>
      <button id="save">保存并应用</button>
    </div>

    <div class="footer">
      设置完成后，刷新目标页面即可生效。
    </div>
  </div>

  <div id="status" class="status-msg">已保存设置</div>

  <script src="popup.js"></script>
</body>
</html>
